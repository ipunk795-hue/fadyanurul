body{font-family:Arial,sans-serif;background:#e9ebee;color:#111}
.page{max-width:700px;margin:auto;background:#fff;min-height:100vh}
.header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:5}
.header-title{font-size:21px;font-weight:700}.back{font-size:40px}.search{width:28px;height:28px;border:3px solid;border-radius:50%;position:relative}.search:after{content:"";position:absolute;width:12px;height:3px;background:#111;right:-9px;bottom:-5px;transform:rotate(45deg)}
.profile{display:flex;align-items:center;padding:16px}.profile img{width:56px;height:56px;border-radius:50%;object-fit:cover;margin-right:12px}.name{font-weight:700;font-size:18px}.name span{font-weight:400}.time{font-size:13px;color:#777;margin-top:4px}.more{margin-left:auto;color:#777;font-size:22px}

.small{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:2px}.small .photo{position:relative}.small img{width:100%;height:220px;object-fit:cover;display:block}.overlay{position:absolute;inset:0;background:#0008;color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700}
.card{padding:17px;border-bottom:1px solid #ddd}.domain{font-size:13px;color:#777;margin-bottom:7px}.row{display:flex;align-items:center;gap:12px}.title{font-size:19px;font-weight:700;flex:1}.cta{border:0;border-radius:7px;padding:13px 16px;background:#1877f2;color:white;font-weight:700;font-size:14px;cursor:pointer}
.reactions{padding:11px 17px;border-bottom:1px solid #ddd;color:#555}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px}.action{border:0;border-radius:22px;padding:11px;background:#f0f2f5;cursor:pointer}
@media(max-width:600px){.gallery img{height:280px}.small img{height:170px}.title{font-size:16px}.cta{padding:11px 12px}}
</style>
</head>
