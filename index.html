DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Looking for a date ❤️</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff}
.container{width:100%;max-width:1100px;margin:auto;background:#fff}
.gallery{width:100%;display:grid;grid-template-columns:2fr 1fr;gap:3px;background:#fff}
.main-photo{width:100%;height:620px;overflow:hidden;text-decoration:none}
.main-photo img,.side-photo img{width:100%;height:100%;object-fit:cover;display:block}
.side-photos{height:620px;display:grid;grid-template-rows:repeat(3,1fr);gap:3px}
.side-photo{position:relative;overflow:hidden;text-decoration:none}
.more-photos::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.more-number{position:absolute;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:72px;font-weight:bold}
.info-box{width:100%;padding:28px 34px;background:#fff;border-bottom:1px solid #ddd}
.domain{color:#6b7280;font-size:23px;margin-bottom:18px}
.bottom-content{display:flex;justify-content:space-between;align-items:center;gap:25px}
.title{color:#111827;font-size:42px;font-weight:700;line-height:1.2}
.open-button{display:inline-flex;align-items:center;justify-content:center;padding:18px 30px;background:#fff;color:#333;border:2px solid #555;border-radius:10px;font-size:22px;font-weight:bold;text-decoration:none;white-space:nowrap;transition:.2s}
.open-button:hover{background:#f1f1f1;transform:scale(1.02)}
.reaction-box{padding:15px 30px;border-bottom:1px solid #ddd;color:#555;font-size:20px}
.actions{display:flex;border-bottom:1px solid #ddd}
.action{width:33.33%;padding:18px;text-align:center;font-size:30px;color:#444;cursor:pointer}
.action:hover{background:#f5f5f5}

@media(max-width:700px){
  .main-photo,.side-photos{height:520px}
  .info-box{padding:22px 18px}
  .domain{font-size:16px}
  .title{font-size:25px}
  .open-button{padding:14px 16px;font-size:15px}
  .more-number{font-size:55px}
  .reaction-box{padding:15px 20px}
  .action{font-size:25px}
}
@media(max-width:420px){
  .main-photo,.side-photos{height:450px}
  .bottom-content{gap:12px}
  .title{font-size:21px}
  .open-button{font-size:12px;padding:12px 13px}
}
</style>
</head>

<body>
<div class="container">

  <div class="gallery">
    <a class="main-photo" href="https://example.com" target="_blank" rel="noopener noreferrer">
      <img src="https://res.cloudinary.com/hbxvgv4e/image/upload/c_fill,w_900,h_900,g_auto/f_auto,q_auto/1000108400" alt="Preview">
    </a>

    <div class="side-photos">
      <a class="side-photo" href="https://example.com" target="_blank" rel="noopener noreferrer">
        <img src="https://res.cloudinary.com/hbxvgv4e/image/upload/c_fill,w_500,h_400,g_auto/f_auto,q_auto/1000108400" alt="">
      </a>
      <a class="side-photo" href="https://example.com" target="_blank" rel="noopener noreferrer">
        <img src="https://res.cloudinary.com/hbxvgv4e/image/upload/c_fill,w_500,h_400,g_auto/f_auto,q_auto/1000108400" alt="">
      </a>
      <a class="side-photo more-photos" href="https://example.com" target="_blank" rel="noopener noreferrer">
        <img src="https://res.cloudinary.com/hbxvgv4e/image/upload/c_fill,w_500,h_400,g_auto/f_auto,q_auto/1000108400" alt="">
        <div class="more-number">+9</div>
      </a>
    </div>
  </div>

  <div class="info-box">
    <div class="domain">EXCLUSIVEDATING.PAGE.GD</div>
    <div class="bottom-content">
      <div class="title">Looking for a date ❤️</div>
      <a class="open-button" href="https://lena-86y2.fumifun.sbs/ke2yue" target="_blank" rel="noopener noreferrer">
        BUKA TAUTAN
      </a>
    </div>
  </div>

  <div class="reaction-box">👍 7</div>

  <div class="actions">
    <div class="action">👍</div>
    <div class="action">💬</div>
    <div class="action">↗️</div>
  </div>

</div>
</body>
</html>
